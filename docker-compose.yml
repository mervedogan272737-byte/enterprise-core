services:
  postgres:
    container_name: enterprise-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: enterprise_db
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: enterprise_password
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U enterprise_user -d enterprise_db
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: enterprise-redis
    image: redis:8
    ports:
      - "6380:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: enterprise-api
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      API_PORT: "8080"
      DATABASE_URL: postgres://enterprise_user:enterprise_password@enterprise-postgres:5432/enterprise_db?sslmode=disable
      REDIS_URL: redis://enterprise-redis:6379
      JWT_SECRET: enterprise-core-super-secret-change-this
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
